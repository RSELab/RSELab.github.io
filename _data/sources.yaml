- id: doi:10.48550/arXiv.2502.05485
  description: This work proposes a hierarchical vision-language-action (VLA) model that improves robot generalization by using off-domain data (like videos or simulations). Instead of predicting actions directly, a high-level model generates a 2D path, which guides a low-level controller. This approach leads to better transfer across domains and improves real-robot performance by 20% on average.
